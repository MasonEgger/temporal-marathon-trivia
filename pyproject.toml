[project]
name = "temporal-marathon-trivia"
version = "0.1.0"
description = "Multi-day trivia platform for trade show booth engagement using Temporal workflows"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "temporalio",
    "fastapi",
    "uvicorn[standard]",
    "redis",
    "pydantic",
    "jinja2",
    "httpx",
    "boto3",
    "python-multipart",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "ruff",
    "fakeredis[lua]",
    "moto[s3]",
    "nox",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",  # Minimum 80% test coverage required
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "src/worker.py",  # Worker entry point - tested by successful startup
    "src/temporal_client.py",  # Connection utility - tested by worker/API startup
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
